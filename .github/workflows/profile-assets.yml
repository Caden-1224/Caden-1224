name: Profile assets

# Each generator writes separately. Only complete, valid light/dark pairs reach
# output; a failed generator retains its previously published pair.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-assets-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check asset generators
        run: python3 -m unittest discover -s tests -v

      - name: Save previously published assets
        run: |
          mkdir -p stats-next snake-next
          python3 scripts/assemble_assets.py snapshot previous

      - name: Generate the stars & public repositories card
        id: stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_USER: ${{ github.repository_owner }}
        run: python3 scripts/build_stats.py stats-next

      - name: Generate the contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake-next/github-contribution-grid-snake.svg?color_snake=#2f6fd0&color_dots=#ebf1f8,#ccdff5,#97bce9,#5a91d8,#2f6fd0
            snake-next/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#5a9be6&color_dots=#162235,#243d59,#326599,#5a9be6,#a6c9f4

      - name: Assemble valid asset pairs
        id: assets
        run: >-
          python3 scripts/assemble_assets.py assemble
          --stats-outcome "${{ steps.stats.outcome }}"
          --snake-outcome "${{ steps.snake.outcome }}"

      - name: Publish available updates
        if: steps.assets.outputs.can_publish == 'true'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report incomplete generation
        if: always() && (steps.stats.outcome == 'failure' || steps.snake.outcome == 'failure' || steps.assets.outputs.degraded == 'true')
        run: |
          echo "::error::Some assets could not be refreshed. Valid previous pairs were retained where available; see the generator and assembly logs."
          exit 1
